[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-open-webcam"
version = "0.1.0"
description = "Use a Canon EOS camera as a webcam on macOS or Windows, no paywall"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cristopher Cervantes" }]
requires-python = ">=3.10"
dependencies = ["websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
canon-webcam = "canon_webcam.cli:main"

[tool.setuptools.packages.find]
include = ["canon_webcam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
