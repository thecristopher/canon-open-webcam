[workspace]
resolver = "3"
members = ["crates/canon-ptp", "crates/canon-wpd", "crates/canon-webcam"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/thecristopher/canon-open-webcam"

[workspace.dependencies]
canon-ptp = { path = "crates/canon-ptp" }
canon-wpd = { path = "crates/canon-wpd" }
anyhow = "1.0.104"
thiserror = "2.0.21"
windows = "0.62.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
